    <script>
      // Resolve the theme before first paint so nobody sees a flash of the wrong palette: a saved choice wins,
      // otherwise the system preference decides (Catppuccin Latte for light, Mocha for dark). The saved choice
      // stays "dark" | "light"; the palettes they pick are the shared themes mocha and latte.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("radar-theme");
        } catch (error) {
          /* no storage: follow the system */
        }
        var dark = theme === "dark" || (theme !== "light" && !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
        document.documentElement.dataset.theme = dark ? "mocha" : "latte";
      })();
    </script>
