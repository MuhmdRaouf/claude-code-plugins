<!doctype html>
<!-- Huddle: the owner's control room. Channels where AI coding sessions (and their subagents)
     work as one team. This page is only the boot shell: the theme goes on <html> before first
     paint, the stylesheet and the one ES module the Preact app builds to load next, and the
     #app node the app renders into. Everything else — the rail, the page headers, the drawers,
     the composer — the app paints.
     Routes: #/ · #/c/<ch>/{overview,today,inbox,team,work[/list|board|graph|map|repo/<view>],knowledge[/<id>],settings}
     A drawer opens over any view: ?t=<task> (task drawer), ?s=<session> (session drawer).
     Aliases (needs, live, plan, board, graph, review, kb, repo, t/<id>) redirect.
     Styles: ui/src/app.css (Tailwind 4 + daisyUI 5, the shared mocha/latte themes) → vite build → app.css. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Huddle</title>
<script>/* theme before first paint: the saved choice (System, Mocha or Latte; an old "dark"/"light" reads as its new name), else the system's */
try { let t = JSON.parse(localStorage.getItem("huddle:theme") || "null"); if (t === "dark" || t === "light") { t = t === "dark" ? "mocha" : "latte"; localStorage.setItem("huddle:theme", JSON.stringify(t)); } document.documentElement.dataset.theme = t === "mocha" || t === "latte" ? t : (matchMedia("(prefers-color-scheme: dark)").matches ? "mocha" : "latte"); } catch { document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "mocha" : "latte"; }</script>
