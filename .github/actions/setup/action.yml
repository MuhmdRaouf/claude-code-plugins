name: setup
description: Node (with the npm cache), optionally Bun, and `npm ci` for the npm workspaces.
inputs:
  node-version:
    description: Node version for actions/setup-node.
    default: "24"
  bun:
    description: Also install Bun ("true" or "false").
    default: "true"
  bun-version:
    description: Bun version; 1.3.14 is the floor the READMEs promise.
    default: "1.3.14"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - run: npm ci
      shell: bash
