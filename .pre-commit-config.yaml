# Pre-commit gate: secrets, Markdown, YAML, workflows and file hygiene, on every commit.
# CI runs the same hooks at the same versions (`pre-commit run --all-files`). Install once per clone:
# `mise run setup`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml', '--redact']

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: (^|/)testdata/
        args: ['--config', '.markdownlint.yaml']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint.yaml']

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Generated outputs (launchers, built pages, golden fixtures) are compared byte for byte by their own checks.
      - id: trailing-whitespace
        exclude: (^|/)(dist|testdata|golden)/|^packages/core/internal/adapters/spool/spool/
      - id: end-of-file-fixer
        exclude: (^|/)(dist|testdata|golden)/|^packages/core/internal/adapters/spool/spool/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: (^|/)dist/
      - id: check-yaml
      - id: check-json
        exclude: (^|/)testdata/
      - id: detect-private-key
        # localca_test.go feeds a fake, unparsable PEM ("EC PRIVATE KEY\nAAAA") to the error cases.
        exclude: (^|/)testdata/|^packages/core/internal/adapters/localca/localca_test\.go$
